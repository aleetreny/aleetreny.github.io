    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The type is loaded out of the way of the first paint.

      A plain <link rel="stylesheet"> to fonts.googleapis.com blocks rendering
      on a third-party round trip: nothing at all is drawn until it answers.
      `media="print"` makes the browser fetch it at normal priority without
      counting it as render-blocking, and the onload flips it back to `all` the
      moment it lands. With `display=swap` already on the request, the board
      paints in the fallback stack and the faces swap in as they arrive.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
