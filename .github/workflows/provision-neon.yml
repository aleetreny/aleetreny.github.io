name: Provision Neon backend

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or apply configuration and migrations
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      environment:
        description: GitHub Environment containing the selected Neon configuration
        required: true
        type: choice
        options: [development, production]
        default: development
      production_confirmation:
        description: Type APPLY_PRODUCTION when applying to production; ignored for plans/development
        required: false
        type: string

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: ${{ vars.NEON_BRANCH }}
      NEON_PROTECT_DEFAULT_BRANCH: ${{ vars.NEON_PROTECT_DEFAULT_BRANCH || 'true' }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      STORAGE_BUCKET: portfolio-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require explicit production confirmation
        if: inputs.operation == 'apply' && inputs.environment == 'production'
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          if [ "$PRODUCTION_CONFIRMATION" != "APPLY_PRODUCTION" ]; then
            echo "::error::Type APPLY_PRODUCTION in production_confirmation before applying production changes."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate provisioning environment
        run: pnpm validate:env -- --mode=provision

      - name: Plan Neon changes
        run: neon config plan --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH"

      - name: Deploy Neon services
        if: inputs.operation == 'apply'
        run: >-
          neon deploy
          --project-id "$NEON_PROJECT_ID"
          --branch "$NEON_BRANCH"
          --update-existing
          --allow-protected
          --no-env-pull

      - name: Apply migrations
        if: inputs.operation == 'apply'
        run: pnpm db:migrate

      - name: Verify database
        if: inputs.operation == 'apply'
        run: pnpm db:verify
