<style>body{margin:0;background:#0b0d11;font:12px monospace;color:#cfe}
canvas{image-rendering:pixelated;display:block}#log{padding:8px;white-space:pre}</style>
<canvas id="out"></canvas><pre id="log"></pre>
<script>
const T=32,S=2,RW=22,RH=7,W=RW*T,H=RH*T,WALL=2;
const room=document.createElement('canvas');room.width=W;room.height=H;
const g=room.getContext('2d');g.imageSmoothingEnabled=false;
const SH={},BB={};
function hs(x,y,k){let h=(x*374761393+y*668265263+(k||0)*2246822519)|0;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967296;}
function ink(sheet,c,r,w,h){
  const k=sheet+c+','+r+','+w+','+h; if(BB[k]!==undefined)return BB[k];
  const cv=document.createElement('canvas');cv.width=T*w;cv.height=T*h;
  const cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
  cx.drawImage(SH[sheet],c*T,r*T,T*w,T*h,0,0,T*w,T*h);
  const d=cx.getImageData(0,0,T*w,T*h).data;
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<T*h;y++)for(let x=0;x<T*w;x++)
    if(d[(y*T*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  return BB[k]=(x1<0?null:{x0,y0,w:x1-x0+1,h:y1-y0+1});
}
const PLACED=[],CLASH=[];
function place(name,sheet,c,r,tx,ty,w,h,dy,dx){
  w=w||1;h=h||1;dy=dy||0;dx=dx||0;
  const b=ink(sheet,c,r,w,h);
  if(!b){CLASH.push('EMPTY  '+name);return;}
  const rect={x:tx*T+b.x0+dx,y:ty*T+b.y0+dy,w:b.w,h:b.h,name};
  for(const o of PLACED){
    const ox=Math.max(0,Math.min(rect.x+rect.w,o.x+o.w)-Math.max(rect.x,o.x));
    const oy=Math.max(0,Math.min(rect.y+rect.h,o.y+o.h)-Math.max(rect.y,o.y));
    if(ox>2&&oy>2) CLASH.push('OVERLAP  '+name+' x '+o.name+'  ('+ox+'x'+oy+')');
  }
  if(rect.x<2||rect.y<2||rect.x+rect.w>W-2||rect.y+rect.h>H-2) CLASH.push('OFF-FRAME  '+name);
  PLACED.push(rect);
  g.drawImage(SH[sheet],c*T,r*T,T*w,T*h,tx*T+dx,ty*T+dy,T*w,T*h);
}

function build(){
  g.fillStyle='#15171c';g.fillRect(0,0,W,H);
  for(let y=WALL;y<RH;y++)for(let x=0;x<RW;x++)
    g.drawImage(SH.shoproom,(hs(x,y,3)>.88?5:6)*T,8*T,T,T,x*T,y*T,T,T);
  const wv=[1,2,3,5,1,3,2];
  for(let x=0;x<RW;x++) g.drawImage(SH.walls,wv[(x*5+3)%wv.length]*T,10*T,T,T*2,x*T,0,T,T*2);
  g.drawImage(SH.walls,4*T,10*T,T,T*2,13*T,0,T,T*2);     // one rusted panel over the stores

  // ══ THE INFIRMARY ═════════════════════════════════════════════
  //  22 x 7 m. A continuous run of steel down the back wall, beds in front
  //  of it, and the slab on its own at the far end.

  // a run of butted units: the sheet's counters are 47 px wide, so they are
  // laid at a 47 px pitch rather than snapped to the 32 px grid, which is
  // how the artist drew them to tile.
  function run(units, x0, ty){
    let px = x0;                        // where this unit's INK must begin
    units.forEach((u,i)=>{
      const w=u[3], h=u[4];
      const b = ink('kit', u[1], u[2], w, h);
      const want = px - b.x0;
      const col = Math.floor(want/T);
      place(u[0]+i, 'kit', u[1], u[2], col, ty, w, h, 0, want-col*T);
      px += b.w;                        // advance by real width, so units butt
    });
  }

  // ── THE BACK WALL · a continuous steel run, cols 7 onward ──
  run([['ctr',0,7,1,2],['ctr',1,7,1,2],['cab',0,9,2,2],['ctr',2,7,1,2],
       ['ctr',3,7,1,2],['shelf',3,9,2,2]], 7*T, 2);

  // ── CLUSTER 1 · TREATMENT, the left end ──────────── cols 1-6
  place('bedA',    'furn',15,7,   1,2, 2,2, 0, 6);          // the one that still reports
  place('drip',    'furn',19,12,  3,2, 1,4);
  place('bedB',    'furn',15,10,  4,2, 2,2);          // the one that does not
  place('trolley', 'furn',8,3,    1,4, 2,2);          // dressings trolley, pulled out
  place('oxyA',    'furn',1,6,    4,4, 1,1, 12);
  place('oxyB',    'furn',1,7,    5,4, 1,1, 12);
  place('stool',   'furn',4,4,    5,5, 1,2, -8);
  place('caseA',   'furn',14,13,  1,6, 1,1, -8);
  place('drumA',   'furn',3,14,   6,5, 1,1, 4);
  place('console', 'furn',1,13,   6,2, 1,1, 12);      // the readout for bed A

  // ── CLUSTER 2 · CONSULTING, in front of the run ──── cols 8-11
  place('chairA',  'furn',3,4,    8,4, 1,2);
  place('lowTable','furn',7,4,    9,4, 1,2);
  place('chairB',  'furn',5,4,   10,4, 1,2);
  place('bench',   'furn',8,13,   8,6, 1,1, -8);      // where you wait your turn
  place('bench2',  'furn',9,13,   9,6, 1,1, -8);
  place('papers',  'furn',2,11,  11,6, 1,1, -10);

  // ── CLUSTER 3 · STORES, past the run ──────────────── cols 15-18
  place('cabinet', 'kit',1,9,    15,2, 2,2);          // the one nobody has audited
  place('rack',    'kit',9,11,   17,2, 2,2);
  place('bin',     'kit',13,11,  12,4, 1,3);
  place('kitB',    'furn',9,8,   13,5, 1,1, 6);
  place('kitC',    'furn',8,9,   14,5, 1,1, 6);
  place('crate',   'furn',15,12, 15,5, 1,1, 8);
  place('box',     'furn',12,12, 16,5, 1,1, 8);
  place('caseB',   'furn',12,13, 14,6, 1,1, -8);
  place('drumB',   'furn',5,14,  17,5, 1,1, 10);

  // ── CLUSTER 4 · THE SLAB ──────────────────────────── cols 19-20
  //  bare steel, and the deck around it is left empty on purpose.
  place('slab',    'kit',10,7,   19,3, 2,2);
  place('sheet',   'furn',16,9,  19,2, 1,1, 10);      // one folded sheet, waiting

  // ── the wall ───────────────────────────────────────────────
  place('cross',   'furn',8,8,    2,1, 1,1, -10);
  place('pipe',    'furn',0,9,    5,1, 1,1, -14);
  place('records', 'furn',13,15,  9,1, 1,1, -10);
  place('warning', 'furn',16,14, 14,1, 1,1, -12);
  place('calendar','furn',13,0,  18,1, 1,1, -12);

  const B=4,fr=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
  fr(0,0,W,B,'#3c424a');fr(0,H-B,W,B,'#3c424a');fr(0,0,B,H,'#3c424a');fr(W-B,0,B,H,'#3c424a');
  fr(0,0,W,2,'#22262c');fr(0,H-2,W,2,'#22262c');fr(0,0,2,H,'#22262c');fr(W-2,0,2,H,'#22262c');
  fr(2,B-2,W-4,2,'#565d66');fr(2,H-B,W-4,2,'#2b3037');
  fr(B-2,2,2,H-4,'#565d66');fr(W-B,2,2,H-4,'#2b3037');
}
function load(n,u){return new Promise(r=>{const i=new Image();i.onload=()=>{SH[n]=i;r();};i.src=u;});}
Promise.all([load('furn','../../public/assets/props/shelter_furniture.png'),load('walls','../../public/assets/props/shelter_walls.png'),
             load('shoproom','../../public/assets/props/workshop_roomtiles.png'),load('kit','../../public/assets/props/kitchen.png')]).then(()=>{
  build();
  const c=document.getElementById('out');c.width=W*S;c.height=H*S;
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(room,0,0,W*S,H*S);
  [['dA',0,0,256,224],['dB',288,0,256,224],['dC',448,0,256,224]].forEach(q=>{
    const d=document.createElement('canvas');d.id=q[0];d.width=q[3]*3;d.height=q[4]*3;
    document.body.appendChild(d);
    const dx=d.getContext('2d');dx.imageSmoothingEnabled=false;
    dx.drawImage(room,q[1],q[2],q[3],q[4],0,0,q[3]*3,q[4]*3);
  });
  document.getElementById('log').textContent =
    CLASH.length?CLASH.join('\n'):'CLEAN — '+PLACED.length+' props, no overlaps, none off-frame';
  window.__ready=1;
});
</script>
